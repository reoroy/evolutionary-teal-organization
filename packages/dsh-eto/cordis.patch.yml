# dsh-eto bundle layer: one plugin entry, no MCP client and no absolute path.
#
# The plugin registers its tools directly on ctx.tools (names without the
# `mcp__eto__` prefix) and spawns `<venv>/bin/python lib/eto_runner.py <tool>`
# itself, so this patch needs nothing but the entry.
#
# Where ETO lives is configuration, resolved at call time (settings page or the
# environment), never a path baked in here:
#   DSH_ETO_REPO    ETO checkout        (default ~/src/eto)
#   DSH_ETO_VENV    its virtualenv      (default <repo>/.venv)
#   DSH_ETO_PYTHON  its interpreter     (default <venv>/bin/python)
#
# A broken ETO does not take the session down: the plugin still loads, the tool
# calls report what is missing, and the sidebar panel shows the same diagnosis.
- insert:
    - id: eto
      name: 'dsh-eto'
      config:
        # Only the ETO flow the panels and the plan/repair path actually need.
        # Full list is TOOL_NAMES in lib/tools.js; empty `[]` means every tool.
        # Dropped from the default surface (re-enable by naming them here):
        #   eto_file_status/update/release — multi-agent file locks
        #   agent_execute                  — heavy peer dispatch
        #   eto_peer_config, eto_memory_list, eto_feedback
        enabledTools:
          - eto_consensus
          - eto_route
          - eto_peer_score
          - eto_clarify
          - eto_review
          - eto_memory_write
          - eto_memory_read

# "ETO 决策会诊" mode: the session's main model stays a real model (so it can
# read files, edit code and call tools), and the persona inserts one
# `eto_consensus(mode="advise")` consultation before a decision that changes
# behaviour (write code / change config / open a PR / irreversible action).
# Declared here as a bundle patch (directory presets are no longer read); to
# place it in a profile patch instead, copy this entry into that profile's
# cordis.patch.yml.
- insert:
    - id: preset-eto-fusion
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: eto-fusion
        name: 'ETO 决策会诊'
        description: '主模型仍是真模型（能调工具），在写代码/改配置/发 PR 等决策前自动调 eto_consensus(mode=advise) 做一次三源会诊（本机 Qwen × deepseek-official × qodercn/GLM）。'
        order: 19
        plugins:
          - id: agent-default-model
            name: '@deepseek-ai/dsh-agent-default-model'
            config:
              provider: deepseek-official
              model: deepseek-flash
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是「ETO 决策会诊」模式。你的主模型是真模型：能正常读文件、改代码、调工具、跑测试。

                ## 什么时候会诊
                - 在做出「会改变行为」的决策之前——写/改代码、改配置、发 PR、删资源、跑不可逆操作——先调 eto_consensus(mode="advise") 会诊一次。
                - 会诊输入：你「打算怎么做」的一小段计划（不是整个会话）。
                - 拿到 synthesis / risks / disagreements 后，采纳其中的建议、规避风险再继续，不要假装没看到分歧。

                ## 什么时候不要会诊
                - 普通问答、解释、闲聊不触发会诊，直接回答。
                - 同一个方案已经会诊过且没有新变化时，不要重复会诊。

                ## 会诊是什么
                - 它是三个不同架构模型的额外意见，不是权威结论；照实转述 degraded 或掉队的 peer，不要粉饰成成功。

                ## 输出习惯
                - 用中文工作；一次只解决一件事。
