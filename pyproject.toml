[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "evolutionary-teal-organization"
version = "0.1.9"
description = "ETO — 青色组织多 Agent 编排架构 / Multi-agent Teal Organization orchestration"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# 依赖与入口的单一真源是 eto/pyproject.toml（`pip install -e eto/` 是文档主安装路径）。
# root 包只为仓库元数据存在，不再重复声明运行依赖或 CLI 入口，避免两处漂移。
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["eto*"]
