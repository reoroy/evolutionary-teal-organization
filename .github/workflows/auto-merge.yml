# Turn on auto-merge for the agent's own pull requests, so a PR it opens merges itself once the
# required checks pass instead of waiting for a person. Branch protection still decides whether the
# checks are enough; this only removes the click.
name: auto-merge agent PRs

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: github.event.pull_request.user.login == 'Roy-superagent'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
